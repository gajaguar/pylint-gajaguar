[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pylint-plugin"
version = "1.1.2"
description = "Plugin with a series of rules based on good practices and personal tastes."
requires-python = ">=3.14"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/checkers"]
include = ["src/main.py"]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py314"
line-length = 119
lint.select = ["ALL"]
lint.ignore = ["CPY", "D", "missing-trailing-comma"]
lint.isort.section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
lint.isort.force-single-line = true
lint.isort.case-sensitive = true
lint.per-file-ignores."tests/**/*.py" = [
  "ANN",
  "ARG",
  "assert",
  "magic-value-comparison",
  "private-member-access",
]

[tool.mypy]
strict = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["astroid.*", "pylint.*"]
ignore_missing_imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = ["**/.venv", "**/node_modules", "tests"]

[tool.pylint.main]
load-plugins = ["checkers"]

[tool.pylint.format]
max-line-length = 119

[tool.pylint."messages control"]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  # Duplicate-code fires on the AAA-fixture scaffolding shared between
  # app-test-* checkers; the similarity is structural, not refactorable.
  "duplicate-code",
  # use-implicit-booleaness-not-comparison duplicates ruff's PLC1802.
  "use-implicit-booleaness-not-comparison",
  # Tests inherit pylint.testutils.CheckerTestCase, which only exposes one
  # assertion-style public method, and intentionally reach into pylint
  # internals (linter._checkers) and pytest fixtures (tmp_path) that
  # remain unused inside the body.
  "too-few-public-methods",
  "protected-access",
  "unused-argument",
]

[dependency-groups]
dev = [
  "astroid>=4.0.4",
  "mypy>=2.3.1",
  "pylint>=4.0.8",
  "pyright>=1.1.414",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.16.8",
]

[tool.uv]
python-preference = "only-system"
python-downloads = "never"
