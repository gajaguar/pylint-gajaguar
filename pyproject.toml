[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pylint-gajaguar"
version = "2.0.1"
description = "Opinionated pylint checkers that encode review preferences beyond ruff"
readme = "README.md"
authors = [{ name = "G.A.JAGUAR", email = "dev@gajaguar.com" }]
license = "MIT"
keywords = ["pylint", "pylint-plugin", "linter", "code-quality"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.14"
dependencies = ["pylint>=4.0"]

[project.urls]
Homepage = "https://github.com/gajaguar/pylint-gajaguar"
Repository = "https://github.com/gajaguar/pylint-gajaguar"
Issues = "https://github.com/gajaguar/pylint-gajaguar/issues"

[dependency-groups]
dev = [
  "astroid>=4.0.4",
  "conventional-git>=1.3",
  "mypy>=2.3.1",
  "pylint>=4.0.9",
  "pyright>=1.1.414",
  "pytest-cov>=7.1",
  "pytest>=9.1",
  "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 119
extend-exclude = ["tools"]
lint.select = ["ALL"]
lint.ignore = ["CPY", "D", "missing-trailing-comma"]
lint.isort.force-single-line = true
lint.per-file-ignores."tests/**/*.py" = ["ARG", "assert", "private-member-access"]

[tool.mypy]
strict = true
exclude = ["tests/", "tools/"]

[[tool.mypy.overrides]]
module = ["astroid.*", "pylint.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src"]

[tool.pylint.main]
load-plugins = ["pylint_gajaguar"]

[tool.pylint."messages control"]
disable = ["all"]
enable = ["gajaguar"]
