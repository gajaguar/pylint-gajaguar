[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pylint-gajaguar"
version = "3.0.0"
description = "Opinionated lint rules that encode review preferences beyond ruff, as a ferrolint plugin"
readme = "README.md"
authors = [{ name = "G.A.JAGUAR", email = "dev@gajaguar.com" }]
license = "MIT"
keywords = ["ferrolint", "pylint", "linter", "wasm", "code-quality"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.9"

[project.urls]
Homepage = "https://github.com/gajaguar/pylint-gajaguar"
Repository = "https://github.com/gajaguar/pylint-gajaguar"
Issues = "https://github.com/gajaguar/pylint-gajaguar/issues"

# The Pylint module that `load-plugins` names; it resolves to this package's plugin.wasm.
[project.entry-points."ferrolint.plugins"]
pylint_gajaguar = "pylint_gajaguar"

[tool.hatch.build.targets.wheel]
packages = ["python/pylint_gajaguar"]
# The component is built by `make plugin` and ignored by git.
artifacts = ["python/pylint_gajaguar/plugin.wasm"]
