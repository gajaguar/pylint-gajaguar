[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pylint-gajaguar"
version = "2.0.0"
description = "Plugin with a series of rules based on good practices and personal tastes."
requires-python = ">=3.14"
dependencies = []

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 119
lint.select = ["ALL"]
lint.ignore = ["CPY", "D", "missing-trailing-comma"]
lint.isort.force-single-line = true
lint.per-file-ignores."tests/**/*.py" = ["ARG", "assert", "private-member-access"]

[tool.mypy]
strict = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["astroid.*", "pylint.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["src"]

[tool.pylint.main]
load-plugins = ["pylint_gajaguar"]

[tool.pylint."messages control"]
disable = ["all"]
enable = [
  "gajaguar-frozenset-constant",
  "gajaguar-module-const-naming",
  "gajaguar-no-docstrings",
  "gajaguar-no-file-level-disable",
  "gajaguar-no-inline-imports",
  "gajaguar-no-relative-imports",
  "gajaguar-require-final",
  "gajaguar-test-aaa-markers",
  "gajaguar-test-name-implementation-detail",
  "gajaguar-test-no-blank-lines",
  "gajaguar-test-no-extra-comments",
  "gajaguar-test-partial-assertion",
  "gajaguar-unused-arg-use-del",
  "gajaguar-use-contextlib-suppress",
]

[dependency-groups]
dev = [
  "astroid>=4.0.4",
  "conventional-git>=1.0",
  "mypy>=2.3.1",
  "pylint>=4.0.9",
  "pyright>=1.1.414",
  "pytest-cov>=7.1",
  "pytest>=9.1",
  "ruff>=0.16.8",
]
