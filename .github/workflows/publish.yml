name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME != Cargo.toml version $version"; exit 1; }
          grep -q "^version = \"$version\"" pyproject.toml || { echo "pyproject.toml version != $version"; exit 1; }
      - run: make wheel
      - name: Install the wheel and import it
        run: |
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv" dist/*.whl
          "$RUNNER_TEMP/venv/bin/python" -c "import pylint_gajaguar"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*.whl
          if-no-files-found: error
  pypi:
    needs: wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
