name: rust
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: dependabot PRs would fill the repository's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: deny
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ runner.os }}-${{ hashFiles('mk/rust.mk') }}
      - if: steps.deny.outputs.cache-hit != 'true'
        run: make install-rust
      - run: uv tool install ferrolint==1.1.0
      - run: make check
      - run: make test
